name: tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # orchestra/testbench pulls in the matching (patched) Laravel release:
          #   testbench 7 -> Laravel 9, 8 -> 10, 9 -> 11, 10 -> 12
          - php: '8.0'
            testbench: '^7.0'
            laravel: '9.x'
          - php: '8.1'
            testbench: '^8.0'
            laravel: '10.x'
          - php: '8.2'
            testbench: '^9.0'
            laravel: '11.x'
          - php: '8.3'
            testbench: '^10.0'
            laravel: '12.x'
          - php: '8.4'
            testbench: '^10.0'
            laravel: '12.x'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit
