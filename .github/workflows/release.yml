name: release

# Automated releases driven by composer.json.
#
# On every push to master (i.e. when a PR is merged) this workflow reads the
# "version" field from composer.json. If a matching tag does not yet exist, it
# runs the test suite and then creates the tag + a GitHub Release. Packagist is
# connected to this repository (via the Packagist GitHub App), so it publishes
# the new version from the tag automatically.
#
# To cut a release: bump "version" in composer.json in your PR and merge it.

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag & release from composer.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from composer.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' composer.json)
          if [ -z "$VERSION" ]; then
            echo "No version set in composer.json; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.version.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring
          coverage: none

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        if: steps.version.outputs.release == 'true'
        run: vendor/bin/phpunit

      - name: Create tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
